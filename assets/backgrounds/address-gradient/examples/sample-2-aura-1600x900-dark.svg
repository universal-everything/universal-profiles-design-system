<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Address aura background">
  <defs>
    <filter id="sample-2-aura-dark-blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="108.0"/></filter>
    <filter id="sample-2-aura-dark-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#121B21"/>
  <circle cx="352.0" cy="270.0" r="495.0" fill="#FB6916" fill-opacity="0.45" filter="url(#sample-2-aura-dark-blur)"/>
  <circle cx="1248.0" cy="648.0" r="495.0" fill="#C5D359" fill-opacity="0.45" filter="url(#sample-2-aura-dark-blur)"/>
  <rect width="1600" height="900" filter="url(#sample-2-aura-dark-grain)" opacity="0.04"/>
</svg>
