    <filter id="sample-1-aura-light-grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F8FAFB"/>
  <circle cx="352.0" cy="270.0" r="495.0" fill="#5AAEB6" fill-opacity="0.3" filter="url(#sample-1-aura-light-blur)"/>
  <circle cx="1248.0" cy="648.0" r="495.0" fill="#1BEAED" fill-opacity="0.3" filter="url(#sample-1-aura-light-blur)"/>
  <rect width="1600" height="900" filter="url(#sample-1-aura-light-grain)" opacity="0.04"/>
</svg>
